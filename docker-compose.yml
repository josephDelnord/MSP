services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: msp-postgres
    environment:
      POSTGRES_USER: msp
      POSTGRES_PASSWORD: msp_password
      POSTGRES_DB: msp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msp -d msp_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - msp-network

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: msp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - msp-network

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: msp-backend
    environment:
      DATABASE_URL: postgresql://msp:msp_password@postgres:5432/msp_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: msp-dev-secret-key-change-in-production
      DEBUG: "true"
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173"]'
      TEMPLATES_DIR: /app/templates
    volumes:
      - ./backend:/app
      - ./templates:/app/templates
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - msp-network
    restart: unless-stopped

  # Frontend React (Vite dev server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: msp-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - msp-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  msp-network:
    driver: bridge
